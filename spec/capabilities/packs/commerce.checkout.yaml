apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: commerce.checkout
  version: 1.0.0
  universe: U24-commerce-cart-checkout
  steward: ucos:org:steward-commerce-cart-checkout
  purpose: 'Checkout orchestration: details, fulfilment options and slots, final signed quote, payment, order placement.'
  capabilityKind: core
  maturity: beta
  phase: 1
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.commerce.Checkout
    commands:
    - StartCheckout
    - SetContact
    - SetShippingAddress
    - SetBillingDetails
    - SelectFulfilmentOption
    - SelectSlot
    - ApplyCode
    - ConfirmAndPay
    - RetryPayment
    - CancelCheckout
    queries:
    - GetCheckout
    events:
    - commerce.checkout.started
    - commerce.checkout.priced
    - commerce.checkout.payment-pending
    - commerce.checkout.completed
    - commerce.checkout.expired
    - commerce.checkout.failed
  consumes:
    events:
    - payment.payment-intent.authorized
    - payment.payment-intent.failed
    - temporal.trigger.fired
  requires:
  - capability: commerce.cart
    version: '>=1 <2'
  - capability: pricing.engine
    version: '>=1 <2'
  - capability: inventory.core
    version: '>=1 <2'
  - capability: fulfillment.core
    version: '>=1 <2'
  - capability: payment.core
    version: '>=1 <2'
  - capability: tax.core
    version: '>=1 <2'
  - capability: geo.core
    version: '>=1 <2'
  - capability: party.core
    version: '>=1 <2'
  - capability: workflow.core
    version: '>=1 <2'
  - capability: privacy.consent
    version: '>=1 <2'
  - capability: order.core
    version: '>=1 <2'
  optional:
  - capability: offer.engine
  temporal:
    kind: S
    uses:
    - D
    - TRG
    - TP
    - AV
  security:
    dataClasses:
    - PII
    threatModel: docs/threat-model.md
  compliance:
    controls:
    - ucos.ctrl.honest-design
    - ucos.ctrl.terms-acceptance
  ui:
    views:
    - checkout.onepage
    - checkout.review
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
    - A11Y-*
