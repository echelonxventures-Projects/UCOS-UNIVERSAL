apiVersion: ucos.io/v1
kind: ServiceLevel
service: composer
universe: U58
tier: T1
owner: ucos:org:platform-composition
phase: 0
slos:
- id: availability
  description: Share of composer requests that succeed (non-5xx, within deadline).
  sli:
    kind: availability
    metric: composer_requests_good_ratio
  objective: 0.999
  rollingWindow: P28D
- id: latency
  description: p95 latency of the critical composer operation.
  sli:
    kind: latency
    metric: compose_duration_ms
    thresholdMs: 10000
    percentile: p95
  objective: 0.99
  rollingWindow: P28D
alerts:
- id: composer.availability.fast-burn
  slo: availability
  condition: burn rate > 14.4 over 1h and > 14.4 over 5m
  severity: page
  runbook: docs/runbooks/composer.md#availability-fast-burn
- id: composer.availability.slow-burn
  slo: availability
  condition: burn rate > 1 over 3d
  severity: ticket
  runbook: docs/runbooks/composer.md#availability-slow-burn
- id: composer.latency.breach
  slo: latency
  condition: p95 > 10000 ms for 15m
  severity: ticket
  runbook: docs/runbooks/composer.md#latency-breach
