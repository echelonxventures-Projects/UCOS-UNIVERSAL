apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: messaging.postal
  version: 1.0.0
  universe: U40-communication
  steward: ucos:org:steward-communication
  purpose: Print-and-mail adapter for postal letters (documents from U42).
  capabilityKind: adapter
  maturity: beta
  phase: 4
  scope: tenant
spec:
  implements:
  - messaging.provider
  requires:
  - capability: integration.core
    version: '>=1 <2'
  selection:
    jurisdictions:
    - '*'
    methods:
    - postal
  temporal:
    kind: V
    uses: []
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
