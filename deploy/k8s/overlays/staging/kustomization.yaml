apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
labels:
  - pairs: { ucos.io/environment: staging }
    includeSelectors: false
patches:
  - target: { kind: ResourceQuota, name: packs-quota }
    patch: |-
      - op: replace
        path: /spec/hard
        value: { requests.cpu: "8", requests.memory: 16Gi, limits.cpu: "16", limits.memory: 32Gi, pods: "100" }
