apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: payment.provider.razorpay
  version: 1.0.0
  universe: U29-payment
  steward: ucos:org:steward-payment
  purpose: 'Razorpay adapter: cards, UPI, net banking, wallets, EMI (India).'
  capabilityKind: adapter
  maturity: beta
  phase: 1
  scope: tenant
spec:
  implements:
  - payment.provider
  requires:
  - capability: integration.core
    version: '>=1 <2'
  selection:
    jurisdictions:
    - ucos:jur:IN
    methods:
    - card
    - upi
    - netbanking
    - wallet
    - emi
  temporal:
    kind: V
    uses:
    - TP
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
