apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
labels:
  - pairs: { ucos.io/environment: prod }
    includeSelectors: false
patches:
  - target: { kind: ResourceQuota, name: packs-quota }
    patch: |-
      - op: replace
        path: /spec/hard
        value: { requests.cpu: "32", requests.memory: 64Gi, limits.cpu: "64", limits.memory: 128Gi, pods: "400" }
