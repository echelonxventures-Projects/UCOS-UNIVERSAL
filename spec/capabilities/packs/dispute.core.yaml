apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: dispute.core
  version: 1.0.0
  universe: U71-dispute-resolution
  steward: ucos:org:steward-dispute-resolution
  purpose: Dispute owns contested outcomes.
  capabilityKind: core
  maturity: experimental
  phase: 3
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.dispute.Dispute
    - ucos.dispute.ReasonCode
    commands:
    - OpenDispute
    - IngestChargeback
    - SubmitEvidence
    - RespondToClaim
    - Decide
    - Appeal
    - ExecuteRemedy
    - AcceptChargeback
    - Represent
    events:
    - dispute.dispute.opened
    - dispute.dispute.decided
    - dispute.dispute.appealed
    - dispute.dispute.closed
    - dispute.chargeback.received
    - dispute.chargeback.won
    - dispute.chargeback.lost
    - dispute.deadline.approaching
  requires:
  - capability: support.core
    version: '>=1 <2'
  - capability: payment.core
    version: '>=1 <2'
  - capability: marketplace.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  - capability: document.core
    version: '>=1 <2'
  - capability: workflow.core
    version: '>=1 <2'
  - capability: audit.core
    version: '>=1 <2'
  - capability: authority.core
    version: '>=1 <2'
  - capability: trust.core
    version: '>=1 <2'
  optional:
  - capability: social.core
  temporal:
    kind: S
    uses:
    - SLA
    - TRG
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
