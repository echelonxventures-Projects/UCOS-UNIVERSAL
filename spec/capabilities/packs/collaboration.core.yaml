apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: collaboration.core
  version: 1.0.0
  universe: U96-work-collaboration
  steward: ucos:org:steward-work-collaboration
  purpose: Collaboration owns how people and agents organise and do knowledge work together.
  capabilityKind: core
  maturity: experimental
  phase: 5
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.collaboration.Space
    - ucos.collaboration.Project
    - ucos.collaboration.Task
    - ucos.collaboration.Thread
    - ucos.collaboration.Timesheet
    - ucos.collaboration.Page
    commands:
    - CreateProject
    - Task
    - Assign
    - Transition
    - Comment
    - Mention
    - LogTime
    - SubmitTimesheet
    - ApproveTimesheet
    - CreatePage
    events:
    - collab.task.created
    - collab.task.assigned
    - collab.task.completed
    - collab.comment.added
    - collab.mention.created
    - collab.timesheet.approved
  requires:
  - capability: party.core
    version: '>=1 <2'
  - capability: org.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  - capability: communication.core
    version: '>=1 <2'
  - capability: asset.core
    version: '>=1 <2'
  - capability: document.core
    version: '>=1 <2'
  - capability: workflow.core
    version: '>=1 <2'
  - capability: search.core
    version: '>=1 <2'
  - capability: sdlc.core
    version: '>=1 <2'
  temporal:
    kind: S
    uses:
    - TP
    - TR
    - REM
    - FCA
    - FEED
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
