# Checks every pull request, every push to main, nightly, and on demand. Runs only tools/ci.sh.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"      # nightly: catches toolchain and dependency drift
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: tools/ci.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Base ref for proto breaking-change detection
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BUF_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "BUF_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - name: Run CI
        run: tools/ci.sh
      - name: Upload rendered site
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: generated/site
          retention-days: 7
          if-no-files-found: ignore
