apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: logistics.core
  version: 1.0.0
  universe: U36-logistics
  steward: ucos:org:steward-logistics
  purpose: Logistics owns moving parcels and freight.
  capabilityKind: core
  maturity: experimental
  phase: 2
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.logistics.Carrier
    - ucos.logistics.RateQuote
    - ucos.logistics.CarrierSelection
    - ucos.logistics.Manifest
    - ucos.logistics.TrackingEvent
    - ucos.logistics.DeliveryException
    - ucos.logistics.Route
    - ucos.logistics.TransportDocument
    commands:
    - RegisterCarrier
    - RateShop
    - SelectCarrier
    - CreateManifest
    - SchedulePickup
    - IngestTracking
    - RaiseNDR
    - ResolveNDR
    - PlanRoutes
    - GenerateTransportDocument
    queries:
    - Rates
    - TransitTime
    - CarrierScorecard
    - RouteStatus
    events:
    - logistics.tracking.updated
    - logistics.ndr.raised
    - logistics.ndr.resolved
    - logistics.pickup.completed
    - logistics.pickup.missed
    - logistics.route.planned
  requires:
  - capability: fulfillment.core
    version: '>=1 <2'
  - capability: geo.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  - capability: integration.core
    version: '>=1 <2'
  - capability: resource.core
    version: '>=1 <2'
  - capability: currency.core
    version: '>=1 <2'
  - capability: pricing.engine
    version: '>=1 <2'
  optional:
  - capability: iot.core
  - capability: trade.core
  temporal:
    kind: S
    uses:
    - R
    - D
    - AV
    - CAL
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
