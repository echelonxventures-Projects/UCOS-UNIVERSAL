apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
labels:
  - pairs: { ucos.io/environment: dev }
    includeSelectors: false
patches:
  - target: { kind: ResourceQuota, name: packs-quota }
    patch: |-
      - op: replace
        path: /spec/hard
        value: { requests.cpu: "4", requests.memory: 8Gi, limits.cpu: "8", limits.memory: 16Gi, pods: "40" }
