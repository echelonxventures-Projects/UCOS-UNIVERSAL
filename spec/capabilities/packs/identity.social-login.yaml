apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: identity.social-login
  version: 1.0.0
  universe: U09-identity
  steward: ucos:org:steward-identity
  purpose: "Social identity providers (Google, Apple\u2026) via OIDC federation."
  capabilityKind: adapter
  maturity: beta
  phase: 1
  scope: tenant
spec:
  implements:
  - identity.federation-provider
  requires:
  - capability: integration.core
    version: '>=1 <2'
  selection:
    jurisdictions:
    - '*'
  temporal:
    kind: V
    uses:
    - TP
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
