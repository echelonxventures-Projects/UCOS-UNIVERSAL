kind: HolidayCalendarSet
release: 2026-10
owner: U13 Temporal steward
note: Fixed-date national holidays only. Festival and Islamic holidays move every year (lunar calendars and moon sighting), and Indian state holidays differ by state; they are imported each year from the
  official gazette or government announcement through a calendar feed (U13 CalendarFeed) and approved by the steward. They are listed here as rules without dates.
