apiVersion: ucos.io/v1
kind: ServiceLevel
service: tax
universe: U31
tier: T0
owner: ucos:org:commerce-tax
phase: 1
slos:
- id: availability
  description: Share of tax requests that succeed (non-5xx, within deadline).
  sli:
    kind: availability
    metric: tax_requests_good_ratio
  objective: 0.9995
  rollingWindow: P28D
- id: latency
  description: p99 latency of the critical tax operation.
  sli:
    kind: latency
    metric: tax_determine_duration_ms
    thresholdMs: 100
    percentile: p99
  objective: 0.99
  rollingWindow: P28D
alerts:
- id: tax.availability.fast-burn
  slo: availability
  condition: burn rate > 14.4 over 1h and > 14.4 over 5m
  severity: page
  runbook: docs/runbooks/tax.md#availability-fast-burn
- id: tax.availability.slow-burn
  slo: availability
  condition: burn rate > 1 over 3d
  severity: ticket
  runbook: docs/runbooks/tax.md#availability-slow-burn
- id: tax.latency.breach
  slo: latency
  condition: p99 > 100 ms for 15m
  severity: page
  runbook: docs/runbooks/tax.md#latency-breach
