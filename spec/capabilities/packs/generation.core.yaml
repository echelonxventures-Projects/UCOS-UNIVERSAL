apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: generation.core
  version: 1.0.0
  universe: U59-generation
  steward: ucos:org:steward-generation
  purpose: Generation owns producing artifacts consumed outside the runtime from definitions and blueprints.
  capabilityKind: core
  maturity: experimental
  phase: 2
  scope: platform
spec:
  provides:
    objectTypes:
    - ucos.generation.GeneratorDefinition
    - ucos.generation.GenerationRun
    commands:
    - RegisterGenerator
    - RunGenerator
    - PublishArtifacts
    - VerifyReproducibility
  requires:
  - capability: composition.core
    version: '>=1 <2'
  - capability: capability.registry
    version: '>=1 <2'
  - capability: meta.core
    version: '>=1 <2'
  - capability: api.core
    version: '>=1 <2'
  - capability: event.core
    version: '>=1 <2'
  - capability: ui.core
    version: '>=1 <2'
  - capability: observability.core
    version: '>=1 <2'
  - capability: sdlc.core
    version: '>=1 <2'
  - capability: certification.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  optional:
  - capability: ai.core
  temporal:
    kind: S
    uses:
    - R
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
