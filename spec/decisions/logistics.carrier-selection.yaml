kind: DecisionTable
id: logistics.carrier-selection
owner: logistics.core
hitPolicy: FIRST
description: Score weights for LOG-L1; carriers that cannot serve COD, hazmat or the destination are filtered out before scoring.
inputs:
- {name: codRequired, type: Boolean}
- {name: hazmat, type: Boolean}
- {name: weightKg, type: Decimal}
- {name: promiseDays, type: Integer}
outputs:
- {name: weightCost, type: Percentage}
- {name: weightSpeed, type: Percentage}
- {name: weightPerformance, type: Percentage}
rules:
- ['*', 'true', '*', '*', 20, 20, 60]
- ['true', '*', '*', '*', 30, 20, 50]
- ['*', '*', '>=20', '*', 60, 20, 20]
- ['*', '*', '*', <=1, 10, 70, 20]
- ['*', '*', '*', '*', 50, 25, 25]
tests:
- input: ['true', 'false', '1.2', '3']
  expect: ['30', '20', '50']
- input: ['false', 'false', '25', '4']
  expect: ['60', '20', '20']
- input: ['false', 'false', '0.5', '1']
  expect: ['10', '70', '20']
- input: ['false', 'false', '0.5', '4']
  expect: ['50', '25', '25']
