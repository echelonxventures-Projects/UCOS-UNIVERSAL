apiVersion: ucos.io/v1
kind: ServiceLevel
service: checkout
universe: U24
tier: T0
owner: ucos:org:commerce-core
phase: 1
slos:
- id: availability
  description: Share of checkout requests that succeed (non-5xx, within deadline).
  sli:
    kind: availability
    metric: checkout_requests_good_ratio
  objective: 0.9995
  rollingWindow: P28D
- id: latency
  description: p99 latency of the critical checkout operation.
  sli:
    kind: latency
    metric: cart_addline_duration_ms
    thresholdMs: 150
    percentile: p99
  objective: 0.99
  rollingWindow: P28D
alerts:
- id: checkout.availability.fast-burn
  slo: availability
  condition: burn rate > 14.4 over 1h and > 14.4 over 5m
  severity: page
  runbook: docs/runbooks/checkout.md#availability-fast-burn
- id: checkout.availability.slow-burn
  slo: availability
  condition: burn rate > 1 over 3d
  severity: ticket
  runbook: docs/runbooks/checkout.md#availability-slow-burn
- id: checkout.latency.breach
  slo: latency
  condition: p99 > 150 ms for 15m
  severity: page
  runbook: docs/runbooks/checkout.md#latency-breach
