apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: infra.core
  version: 1.0.0
  universe: U73-infrastructure-deployment
  steward: ucos:org:steward-infrastructure-deployment
  purpose: Cells, placement, deployments, blueprint activation, backups and disaster recovery.
  capabilityKind: core
  maturity: beta
  phase: 0
  scope: platform
spec:
  provides:
    objectTypes:
    - ucos.infra.Cell
    - ucos.infra.Placement
    - ucos.infra.Deployment
    - ucos.infra.Activation
    - ucos.infra.BackupPolicy
    - ucos.infra.DRPlan
    - ucos.infra.Environment
    commands:
    - ProvisionCell
    - PlaceTenant
    - MigrateShard
    - Deploy
    - ActivateBlueprint
    - RollbackActivation
    - FailoverCell
    queries:
    - TenantPlacement
    - DriftReport
    events:
    - infra.activation.completed
    - infra.activation.rolled-back
    - infra.cell.failed-over
  requires:
  - capability: security.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  temporal:
    kind: S
    uses:
    - R
    - POL
    - D
    - TRG
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
