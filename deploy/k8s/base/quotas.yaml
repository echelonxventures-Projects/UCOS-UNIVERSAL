# Default resource bounds; overlays size them per environment.
apiVersion: v1
kind: ResourceQuota
metadata: { name: packs-quota, namespace: ucos-packs-third-party }
spec:
  hard: { requests.cpu: "8", requests.memory: 16Gi, limits.cpu: "16", limits.memory: 32Gi, pods: "100" }
---
apiVersion: v1
kind: LimitRange
metadata: { name: pack-defaults, namespace: ucos-packs-third-party }
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max: { cpu: "2", memory: 2Gi }
