apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: support.core
  version: 1.0.0
  universe: U39-support-case
  steward: ucos:org:steward-support-case
  purpose: Support owns cases.
  capabilityKind: core
  maturity: experimental
  phase: 3
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.support.Case
    - ucos.support.CaseCategory
    - ucos.support.Macro
    - ucos.support.SLAPolicy
    - ucos.support.SatisfactionSurvey
    commands:
    - OpenCase
    - Classify
    - Assign
    - Reply
    - ExecuteAction
    - SetPending
    - Resolve
    - Reopen
    - Escalate
    - MergeCases
    - RecordCsat
    events:
    - support.case.opened
    - support.case.assigned
    - support.case.resolved
    - support.case.reopened
    - support.case.escalated
    - support.sla.breached
    - support.csat.recorded
  requires:
  - capability: communication.core
    version: '>=1 <2'
  - capability: contactcenter.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  - capability: workflow.core
    version: '>=1 <2'
  - capability: party.core
    version: '>=1 <2'
  - capability: order.core
    version: '>=1 <2'
  - capability: fulfillment.core
    version: '>=1 <2'
  - capability: payment.core
    version: '>=1 <2'
  - capability: inventory.core
    version: '>=1 <2'
  - capability: agent.core
    version: '>=1 <2'
  - capability: privacy.consent
    version: '>=1 <2'
  temporal:
    kind: S
    uses:
    - SLA
    - CAL
    - TRG
    - TP
    - D
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
