apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: evolution.core
  version: 1.0.0
  universe: U76-evolution
  steward: ucos:org:steward-evolution
  purpose: Evolution owns governed change to the platform itself.
  capabilityKind: core
  maturity: experimental
  phase: 3
  scope: platform
spec:
  provides:
    objectTypes:
    - ucos.evolution.Insight
    - ucos.evolution.Deprecation
    - ucos.evolution.Rollout
    - ucos.evolution.UpgradeAdvisory
    - ucos.evolution.ImprovementProposal
    commands:
    - MineInsights
    - ProposeImprovement
    - AnalyseImpact
    - PlanRollout
    - AdvanceRollout
    - HaltRollout
    - AnnounceDeprecation
    - IssueAdvisory
    events:
    - evolution.insight.found
    - evolution.rollout.advanced
    - evolution.rollout.halted
    - evolution.rollout.completed
    - evolution.deprecation.announced
    - evolution.deprecation.sunset
  requires:
  - capability: observability.core
    version: '>=1 <2'
  - capability: composition.core
    version: '>=1 <2'
  - capability: governance.core
    version: '>=1 <2'
  - capability: certification.core
    version: '>=1 <2'
  - capability: capability.registry
    version: '>=1 <2'
  - capability: ai.core
    version: '>=1 <2'
  - capability: agent.core
    version: '>=1 <2'
  - capability: gap.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  optional:
  - capability: simulation.core
  temporal:
    kind: S
    uses:
    - TR
    - POL
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
