apiVersion: ucos.io/v1
kind: ServiceLevel
service: context-resolver
universe: U16
tier: T0
owner: ucos:org:platform-kernel
phase: 0
slos:
- id: availability
  description: Share of context-resolver requests that succeed (non-5xx, within deadline).
  sli:
    kind: availability
    metric: context_resolver_requests_good_ratio
  objective: 0.9995
  rollingWindow: P28D
- id: latency
  description: p99 latency of the critical context-resolver operation.
  sli:
    kind: latency
    metric: context_resolve_duration_ms
    thresholdMs: 20
    percentile: p99
  objective: 0.99
  rollingWindow: P28D
alerts:
- id: context-resolver.availability.fast-burn
  slo: availability
  condition: burn rate > 14.4 over 1h and > 14.4 over 5m
  severity: page
  runbook: docs/runbooks/context-resolver.md#availability-fast-burn
- id: context-resolver.availability.slow-burn
  slo: availability
  condition: burn rate > 1 over 3d
  severity: ticket
  runbook: docs/runbooks/context-resolver.md#availability-slow-burn
- id: context-resolver.latency.breach
  slo: latency
  condition: p99 > 20 ms for 15m
  severity: page
  runbook: docs/runbooks/context-resolver.md#latency-breach
