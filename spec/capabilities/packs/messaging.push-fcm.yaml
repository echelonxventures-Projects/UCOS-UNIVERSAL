apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: messaging.push-fcm
  version: 1.0.0
  universe: U40-communication
  steward: ucos:org:steward-communication
  purpose: Firebase Cloud Messaging adapter (Android and cross-platform push).
  capabilityKind: adapter
  maturity: beta
  phase: 3
  scope: tenant
spec:
  implements:
  - messaging.provider
  requires:
  - capability: integration.core
    version: '>=1 <2'
  selection:
    jurisdictions:
    - '*'
    methods:
    - push-android
  temporal:
    kind: V
    uses: []
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
