apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: resource.core
  version: 1.0.0
  universe: U17-resource
  steward: ucos:org:steward-resource
  purpose: Resource owns things and people that provide capacity over time.
  capabilityKind: core
  maturity: experimental
  phase: 2
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.resource.ResourceType
    - ucos.resource.Resource
    - ucos.resource.ResourcePool
    - ucos.resource.CapacityPlan
    commands:
    - DefineResourceType
    - RegisterResource
    - AssignSkill
    - AttachCredential
    - SetResourceCalendar
    - DefinePool
    - RetireResource
    queries:
    - EligibleResources
    - PoolCapacity
    - Utilisation
    events:
    - resource.resource.registered
    - resource.resource.retired
    - resource.skill.expiring
  requires:
  - capability: temporal.core
    version: '>=1 <2'
  - capability: geo.core
    version: '>=1 <2'
  - capability: party.core
    version: '>=1 <2'
  - capability: service.intelligence
    version: '>=1 <2'
  - capability: currency.core
    version: '>=1 <2'
  optional:
  - capability: installed-base.core
  - capability: workforce.core
  temporal:
    kind: S
    uses:
    - CAL
    - AV
    - R
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
