apiVersion: ucos.io/v1
kind: Capability
metadata:
  id: privacy.dsr
  version: 1.0.0
  universe: U66-privacy-consent
  steward: ucos:org:steward-privacy-consent
  purpose: Data subject requests (access, rectification, erasure, portability, grievance) across universes.
  capabilityKind: core
  maturity: beta
  phase: 1
  scope: tenant
spec:
  provides:
    objectTypes:
    - ucos.privacy.DataSubjectRequest
    commands:
    - SubmitDSR
    - VerifyDSRIdentity
    - CompleteDSR
    queries:
    - DSRStatus
    events:
    - privacy.dsr.received
    - privacy.dsr.completed
    - privacy.dsr.overdue
  requires:
  - capability: party.core
    version: '>=1 <2'
  - capability: workflow.core
    version: '>=1 <2'
  - capability: temporal.core
    version: '>=1 <2'
  - capability: identity.core
    version: '>=1 <2'
  temporal:
    kind: S
    uses:
    - SLA
    - TRG
  security:
    dataClasses:
    - PII
    threatModel: docs/threat-models/party-and-privacy.md
  compliance:
    controls:
    - ucos.ctrl.dsr-erasure
    - ucos.ctrl.dsr-access
  ui:
    views:
    - privacy.dsr.console
  certification:
    gates:
    - ARCH-*
    - SEC-*
    - TEST-*
    - DOC-*
    - OBS-*
    - A11Y-*
