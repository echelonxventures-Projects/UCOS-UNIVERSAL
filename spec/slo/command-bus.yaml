apiVersion: ucos.io/v1
kind: ServiceLevel
service: command-bus
universe: U61
tier: T0
owner: ucos:org:platform-kernel
phase: 0
slos:
- id: availability
  description: Share of command-bus requests that succeed (non-5xx, within deadline).
  sli:
    kind: availability
    metric: command_bus_requests_good_ratio
  objective: 0.9995
  rollingWindow: P28D
- id: latency
  description: p99 latency of the critical command-bus operation.
  sli:
    kind: latency
    metric: command_execute_duration_ms
    thresholdMs: 250
    percentile: p99
  objective: 0.99
  rollingWindow: P28D
alerts:
- id: command-bus.availability.fast-burn
  slo: availability
  condition: burn rate > 14.4 over 1h and > 14.4 over 5m
  severity: page
  runbook: docs/runbooks/command-bus.md#availability-fast-burn
- id: command-bus.availability.slow-burn
  slo: availability
  condition: burn rate > 1 over 3d
  severity: ticket
  runbook: docs/runbooks/command-bus.md#availability-slow-burn
- id: command-bus.latency.breach
  slo: latency
  condition: p99 > 250 ms for 15m
  severity: page
  runbook: docs/runbooks/command-bus.md#latency-breach
